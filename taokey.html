<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TẠO KEY ADMIN</title>
<style>
:root{--cyan:#00e5ff;--blue:#0099cc;--bg:#000;--card:#071318;--border:#0a3040}
*{box-sizing:border-box;font-family:Segoe UI,Tahoma,sans-serif}
body{margin:0;min-height:100vh;background:#000;color:#fff;display:flex;justify-content:center;align-items:center;padding:15px}
.box{width:100%;max-width:420px;background:linear-gradient(160deg,#061015,#040c10);border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:0 15px 40px #000,0 0 25px rgba(0,229,255,.08)}
h1{text-align:center;color:var(--cyan);font-size:20px;letter-spacing:1.5px;text-shadow:0 0 10px rgba(0,229,255,.4);margin:0 0 22px}
label{display:block;color:#557788;font-size:11px;font-weight:700;margin:0 0 7px;text-transform:uppercase}
input,select,textarea{width:100%;background:#071318;color:#fff;border:1px solid var(--border);border-radius:8px;padding:12px;outline:none;margin-bottom:15px}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,.2)}
select{appearance:auto}
button{width:100%;padding:12px;border-radius:7px;border:1px solid var(--cyan);background:linear-gradient(180deg,var(--cyan),var(--blue));color:#000;font-weight:900;cursor:pointer;margin-bottom:10px}
button:active{transform:scale(.98)}
.secondary{background:#071318;color:var(--cyan);border-color:var(--border)}
.result{display:none;margin-top:10px}
.key{font-family:monospace;color:var(--cyan);font-size:16px;text-align:center;font-weight:900;word-break:break-all;background:#061318;border:1px dashed var(--cyan);padding:13px;border-radius:7px;margin-bottom:10px}
textarea{height:80px;resize:none;font-family:monospace;color:#00ffcc}
.status{text-align:center;color:#557788;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<h1>HỆ THỐNG TẠO KEY</h1>

<label>UID / Mã máy</label>
<input id="uid" placeholder="DEV-3ICGMQR0X" autocomplete="off">

<label>Chọn gói</label>
<select id="package">
<option value="V1">V1</option>
<option value="V2">V2</option>
<option value="V3">V3</option>
<option value="PREMIUM">PREMIUM</option>
</select>

<button onclick="createKey()">TẠO KEY</button>

<div class="result" id="result">
<label>Key đã tạo</label>
<div class="key" id="key"></div>
<button class="secondary" onclick="copyKey()">SAO CHÉP KEY</button>

<label>Dòng đưa vào key.txt</label>
<textarea id="record" readonly></textarea>
<button class="secondary" onclick="copyRecord()">SAO CHÉP DÒNG KEY</button>
</div>

<div class="status" id="status">Sẵn sàng</div>
</div>

<script src="./key.js"></script>
<script>
function createKey(){
    const uid=document.getElementById("uid").value.trim().toUpperCase();
    const pkg=document.getElementById("package").value;

    if(!uid){
        document.getElementById("status").textContent="Vui lòng nhập UID / mã máy.";
        return;
    }

    const data=createKeyRecord(uid,pkg);
    document.getElementById("key").textContent=data.key;
    document.getElementById("record").value=data.line;
    document.getElementById("result").style.display="block";
    document.getElementById("status").textContent="Đã tạo key "+pkg+" cho "+uid;
}

function copyKey(){
    navigator.clipboard.writeText(document.getElementById("key").textContent);
    document.getElementById("status").textContent="Đã sao chép key.";
}

function copyRecord(){
    navigator.clipboard.writeText(document.getElementById("record").value);
    document.getElementById("status").textContent="Đã sao chép dòng key.";
}
</script>
</body>
</html>
