<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - Proxy PhamSon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Bảng Quản Trị Key</h2>
        <input type="text" id="ownerName" placeholder="Tên khách hàng">
        <input type="number" id="hours" placeholder="Số giờ (vd: 24)">
        <button onclick="createKey()">Tạo Key Mới</button>
        <div id="resultBox"></div>
    </div>
    <script>
        async function createKey() {
            const owner = document.getElementById('ownerName').value;
            const hours = document.getElementById('hours').value;
            // Tạo key ngẫu nhiên
            const key = Math.random().toString(36).substring(2, 12).toUpperCase();
            
            const response = await fetch('/api/create-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key, owner, hours })
            });
            const data = await response.json();
            document.getElementById('resultBox').innerHTML = `<h3>Key mới: ${key}</h3>`;
        }
    </script>
</body>
</html>
