<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>IQ Puzzle Solver 6x10</title>

<style>
body{
    font-family:Arial;
    text-align:center;
}

#board{
    display:grid;
    grid-template-columns:repeat(6,45px);
    gap:2px;
    margin:20px auto;
    width:max-content;
}

.cell{
    width:45px;
    height:45px;
    border:1px solid #ccc;
    background:#eee;
}

button{
    padding:10px 20px;
    font-size:16px;
}
</style>
</head>

<body>

<h2>IQ Puzzle Solver 6x10</h2>

<button onclick="startSolve()">Solve</button>

<div id="board"></div>

<script>

const W = 6;
const H = 10;

const COLORS = [
"#ff4444",
"#44aa44",
"#4444ff",
"#ffaa00",
"#aa00ff",
"#00bbbb",
"#ff66aa",
"#666666",
"#88aa00",
"#00aaff",
"#aa5500",
"#5555aa"
];

const pieces = [

{
name:"line5",
cells:[
[0,0],
[1,0],
[2,0],
[3,0],
[4,0]
]
},

{
name:"cross",
cells:[
[1,0],
[0,1],
[1,1],
[2,1],
[1,2]
]
},

{
name:"L",
cells:[
[0,0],
[0,1],
[0,2],
[1,2],
[2,2]
]
}

];

let board = [];

function initBoard(){
    board = [];
    for(let y=0;y<H;y++){
        board[y]=[];
        for(let x=0;x<W;x++){
            board[y][x]=-1;
        }
    }
}

function drawBoard(){
    const div=document.getElementById("board");
    div.innerHTML="";

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){

            const c=document.createElement("div");
            c.className="cell";

            if(board[y][x]>=0){
                c.style.background=
                    COLORS[board[y][x]%COLORS.length];
            }

            div.appendChild(c);
        }
    }
}

function rotate(shape){

    let r=[];

    for(const [x,y] of shape){
        r.push([-y,x]);
    }

    return normalize(r);
}

function normalize(shape){

    let minX=Math.min(...shape.map(v=>v[0]));
    let minY=Math.min(...shape.map(v=>v[1]));

    return shape.map(v=>[
        v[0]-minX,
        v[1]-minY
    ]).sort();
}

function variants(piece){

    let list=[];
    let cur=piece.cells;

    for(let i=0;i<4;i++){

        cur=rotate(cur);

        let key=JSON.stringify(cur);

        if(!list.some(v=>JSON.stringify(v)==key))
            list.push(cur);
    }

    return list;
}

function canPlace(shape,ox,oy){

    for(const [x,y] of shape){

        let nx=ox+x;
        let ny=oy+y;

        if(nx<0||ny<0||nx>=W||ny>=H)
            return false;

        if(board[ny][nx]!=-1)
            return false;
    }

    return true;
}

function place(shape,ox,oy,id){

    for(const [x,y] of shape){

        board[oy+y][ox+x]=id;
    }
}

function remove(shape,ox,oy){

    for(const [x,y] of shape){

        board[oy+y][ox+x]=-1;
    }
}

function findEmpty(){

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){

            if(board[y][x]==-1)
                return [x,y];
        }
    }

    return null;
}

function solve(index){

    if(index===pieces.length){

        return findEmpty()==null;
    }

    let piece=pieces[index];

    for(const shape of variants(piece)){

        for(let y=0;y<H;y++){

            for(let x=0;x<W;x++){

                if(canPlace(shape,x,y)){

                    place(shape,x,y,index);

                    if(solve(index+1))
                        return true;

                    remove(shape,x,y);
                }
            }
        }
    }

    return false;
}

function startSolve(){

    initBoard();

    let ok=solve(0);

    drawBoard();

    alert(
        ok
        ? "Đã tìm thấy nghiệm"
        : "Không có nghiệm"
    );
}

initBoard();
drawBoard();

</script>

</body>
</html>
