<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aimbot Web Demo</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; }
        #container { position: relative; width: 100vw; height: 100vh; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; 
                     border: 2px solid #f00; border-radius: 50%; transition: all 0.1s; }
        #aim-dot { position: absolute; width: 4px; height: 4px; background: #ff0; border-radius: 50%; 
                   transition: all 0.05s; display: none; }
        #controls { position: absolute; top: 10px; left: 10px; z-index: 10; }
        button { background: #333; color: #0f0; border: 1px solid #0f0; padding: 8px 16px; margin: 2px; cursor: pointer; }
        button.active { background: #0f0; color: #000; }
        #status { position: absolute; bottom: 10px; left: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div id="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
        <div id="crosshair"></div>
        <div id="aim-dot"></div>
        <div id="controls">
            <button id="startBtn">BẮT ĐẦU</button>
            <button id="stopBtn" disabled>DỪNG</button>
            <label>FOV: <input type="range" id="fov" min="1" max="50" value="10"></label>
            <label>Smooth: <input type="range" id="smooth" min="1" max="10" value="3"></label>
        </div>
        <div id="status">Nhấn BẮT ĐẦU → Share screen → Enemy màu đỏ</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const crosshair = document.getElementById('crosshair');
        const aimDot = document.getElementById('aim-dot');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const fovSlider = document.getElementById('fov');
        const smoothSlider = document.getElementById('smooth');
        const status = document.getElementById('status');

        let stream = null;
        let animationId = null;
        let isAiming = false;
        let targetX = 0, targetY = 0;
        let fov = 10, smooth = 3;

        // Resize canvas
        function resize() {
            const rect = video.getBoundingClientRect();
            overlay.width = rect.width;
            overlay.height = rect.height;
            crosshair.style.left = (rect.width / 2) + 'px';
            crosshair.style.top = (rect.height / 2) + 'px';
        }

        // Detect enemy (simple color + ML-like contour)
        function detectEnemies() {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = overlay.width;
            tempCanvas.height = overlay.height;
            
            tempCtx.drawImage(video, 0, 0, overlay.width, overlay.height);
            const imageData = tempCtx.getImageData(0, 0, overlay.width, overlay.height);
            const data = imageData.data;

            let closestDist = Infinity;
            let bestX = 0, bestY = 0;

            // Scan for red enemies (HSV-like in RGB)
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i+1], b = data[i+2];
                // Red enemy detection (adjust cho game)
                if (r > 150 && g < 100 && b < 100) {
                    const x = (i / 4) % overlay.width;
                    const y = Math.floor((i / 4) / overlay.width);
                    const dist = Math.hypot(x - overlay.width/2, y - overlay.height/2);
                    
                    if (dist < fov * 10 && dist < closestDist) {  // FOV limit
                        closestDist = dist;
                        bestX = x;
                        bestY = y;
                    }
                }
            }

            if (closestDist < Infinity) {
                // Smooth aim
                targetX += (bestX - overlay.width/2) / smooth;
                targetY += (bestY - overlay.height/2) / smooth;
                targetX *= 0.8; targetY *= 0.8;  // Dampening
                return true;
            }
            return false;
        }

        // Mouse move simulation (Web API)
        function moveMouse(x, y) {
            const centerX = overlay.width / 2;
            const centerY = overlay.height / 2;
            const dx = (x - centerX) * 0.1;  // Sensitivity
            const dy = (y - centerY) * 0.1;
            
            // Simulate subtle mouse move (dùng cho overlay aim)
            crosshair.style.transform = `translate(${dx}px, ${dy}px)`;
        }

        // Main loop
        function gameLoop() {
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            
            if (isAiming && detectEnemies()) {
                moveMouse(targetX + overlay.width/2, targetY + overlay.height/2);
                aimDot.style.left = (targetX + overlay.width/2 - 2) + 'px';
                aimDot.style.top = (targetY + overlay.height/2 - 2) + 'px';
                aimDot.style.display = 'block';
                status.textContent = `AIM LOCKED | FOV:${fov} Smooth:${smooth}`;
            } else {
                aimDot.style.display = 'none';
                status.textContent = 'Scanning... (Red enemies)';
            }
            
            animationId = requestAnimationFrame(gameLoop);
        }

        // Controls
        startBtn.onclick = async () => {
            try {
                stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    resize();
                    window.addEventListener('resize', resize);
                    isAiming = true;
                    gameLoop();
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    startBtn.classList.remove('active');
                    stopBtn.classList.add('active');
                };
            } catch(e) {
                alert('Cần cho phép share screen!');
            }
        };

        stopBtn.onclick = () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
            if (animationId) cancelAnimationFrame(animationId);
            isAiming = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            aimDot.style.display = 'none';
            status.textContent = 'Stopped';
        };

        fovSlider.oninput = () => { fov = +fovSlider.value; };
        smoothSlider.oninput = () => { smooth = +smoothSlider.value; };
    </script>
</body>
</html>
