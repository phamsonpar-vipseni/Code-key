<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bí Mật</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Georgia', serif; }

  /* SCREEN 1 - Lá thư */
  #screen1 {
    width: 100vw; height: 100vh;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
  }
  .title-hint { color: #aaa; font-size: 1rem; margin-bottom: 30px; letter-spacing: 3px; text-transform: uppercase; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

  .envelope {
    width: 140px; height: 100px;
    position: relative;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255,200,100,0.5));
  }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-20px) rotate(2deg)} }

  .env-body {
    width: 140px; height: 100px;
    background: linear-gradient(145deg, #f5e6c8, #e8d5a3);
    border-radius: 4px;
    position: absolute; bottom: 0;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  .env-flap {
    width: 0; height: 0;
    border-left: 70px solid transparent;
    border-right: 70px solid transparent;
    border-top: 55px solid #d4b896;
    position: absolute; top: 0;
  }
  .env-letter {
    font-size: 2.5rem;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: heartbeat 1.5s infinite;
  }
  @keyframes heartbeat { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.3)} }

  .click-text { color: #f5e6c8; margin-top: 25px; font-size: 0.85rem; letter-spacing: 2px; animation: pulse 1.5s infinite; }

  /* Stars */
  .star { position: absolute; width: 3px; height: 3px; background: white; border-radius: 50%; animation: twinkle 2s infinite; }
  @keyframes twinkle { 0%,100%{opacity:0} 50%{opacity:1} }

  /* SCREEN 2 - Mật khẩu */
  #screen2 {
    display: none;
    width: 100vw; height: 100vh;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    align-items: center; justify-content: center; flex-direction: column;
  }
  .lock-icon { font-size: 4rem; margin-bottom: 20px; animation: shake 0.5s ease; }
  @keyframes shake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-10deg)} 75%{transform:rotate(10deg)} }
  .pw-title { color: #f5e6c8; font-size: 1.1rem; letter-spacing: 3px; margin-bottom: 30px; }
  .pw-box {
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(245,230,200,0.3);
    border-radius: 12px;
    padding: 30px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 15px;
    backdrop-filter: blur(10px);
  }
  #pwInput {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(245,230,200,0.5);
    border-radius: 8px;
    padding: 12px 20px;
    color: white; font-size: 1.2rem;
    text-align: center; letter-spacing: 4px;
    outline: none; width: 200px;
  }
  #pwInput::placeholder { color: rgba(255,255,255,0.3); letter-spacing: 2px; font-size: 0.9rem; }
  #pwBtn {
    background: linear-gradient(135deg, #f5e6c8, #d4b896);
    color: #1a1a2e; border: none;
    border-radius: 8px; padding: 10px 30px;
    font-size: 1rem; font-weight: bold;
    cursor: pointer; transition: all 0.3s;
  }
  #pwBtn:hover { transform: scale(1.05); }
  #pwError { color: #ff6b6b; font-size: 0.85rem; min-height: 20px; animation: shake 0.3s; }

  /* SCREEN 3 - Party */
  #screen3 {
    display: none;
    width: 100vw; height: 100vh;
    background: #fff5f5;
    position: relative; overflow: hidden;
  }

  .floating-text {
    position: fixed;
    font-weight: 900;
    pointer-events: none;
    user-select: none;
    z-index: 10;
    animation: floatAround linear forwards;
  }
  @keyframes floatAround {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.3; }
  }

  .flying-img {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 20;
    border: 3px solid white;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    animation: flyOut linear forwards;
  }
  @keyframes flyOut {
    0% { transform: scale(0) rotate(0deg); opacity: 1; }
    20% { transform: scale(1) rotate(45deg); opacity: 1; }
    100% { transform: scale(0.5) rotate(360deg) translateY(100px); opacity: 0; }
  }

  .firework {
    position: fixed;
    pointer-events: none;
    z-index: 5;
    width: 6px; height: 20px;
    border-radius: 3px;
    animation: fireworkAnim 1.5s ease-out forwards;
  }
  @keyframes fireworkAnim {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-120px) scale(0); opacity: 0; }
  }

  .center-msg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; z-index: 30;
    animation: popIn 0.8s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
  }
  @keyframes popIn { 0%{transform:translate(-50%,-50%) scale(0)} 100%{transform:translate(-50%,-50%) scale(1)} }
  .center-msg h1 { font-size: clamp(2rem, 8vw, 4rem); color: #e74c3c; text-shadow: 3px 3px 0 #ff9999; }
  .center-msg p { color: #888; font-size: 1rem; margin-top: 10px; }
</style>
</head>
<body>

<!-- SCREEN 1 -->
<div id="screen1" onclick="openEnvelope()">
  <p class="title-hint">✉ Có thư cho bạn</p>
  <div class="envelope">
    <div class="env-body"></div>
    <div class="env-flap"></div>
    <div class="env-letter">💌</div>
  </div>
  <p class="click-text">[ Chạm để mở ]</p>
</div>

<!-- SCREEN 2 -->
<div id="screen2" style="display:none;flex-direction:column;align-items:center;justify-content:center;">
  <div class="lock-icon">🔐</div>
  <p class="pw-title">NHẬP MẬT KHẨU</p>
  <div class="pw-box">
    <input type="password" id="pwInput" placeholder="Mật khẩu..." maxlength="10" onkeydown="if(event.key==='Enter') checkPw()">
    <button id="pwBtn" onclick="checkPw()">MỞ KHÓA 🔓</button>
    <p id="pwError"></p>
  </div>
</div>

<!-- SCREEN 3 -->
<div id="screen3">
  <div class="center-msg">
    <h1>🎉 AI HỎI 🎉</h1>
    <p>Mày vừa mở được bí mật 😂</p>
  </div>
</div>

<script>
// Tạo sao nền screen1
const s1 = document.getElementById('screen1');
for(let i=0;i<80;i++){
  const star = document.createElement('div');
  star.className = 'star';
  star.style.left = Math.random()*100+'vw';
  star.style.top = Math.random()*100+'vh';
  star.style.animationDelay = Math.random()*3+'s';
  star.style.opacity = Math.random();
  s1.appendChild(star);
}

function openEnvelope() {
  document.getElementById('screen1').style.display = 'none';
  const s2 = document.getElementById('screen2');
  s2.style.display = 'flex';
}

function checkPw() {
  const val = document.getElementById('pwInput').value;
  const err = document.getElementById('pwError');
  if(val.toLowerCase() === 'aihoi') {
    document.getElementById('screen2').style.display = 'none';
    document.getElementById('screen3').style.display = 'block';
    startParty();
  } else {
    err.textContent = '❌ Sai rồi! Thử lại đi...';
    document.getElementById('pwInput').value = '';
    setTimeout(()=>err.textContent='', 2000);
  }
}

function startParty() {
  // Text "AI HỎI" rơi liên tục
  const texts = ['AI HỎI','😂','AI HỎI??','AIHOI','🤣','AI HỎI GÌ?','❓','AI HỎI ĐÓ','💀'];
  const colors = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6','#e91e63','#00bcd4'];

  setInterval(() => {
    const el = document.createElement('div');
    el.className = 'floating-text';
    el.textContent = texts[Math.floor(Math.random()*texts.length)];
    el.style.left = Math.random()*90+'vw';
    el.style.top = '-5vh';
    el.style.fontSize = (Math.random()*2+0.8)+'rem';
    el.style.color = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (Math.random()*4+3)+'s';
    document.getElementById('screen3').appendChild(el);
    setTimeout(()=>el.remove(), 7000);
  }, 300);

  // Ảnh bay ra liên tục
  setInterval(() => {
    const img = document.createElement('img');
    img.className = 'flying-img';
    img.src = IMG_SRC;
    const size = Math.random()*80+40;
    img.style.width = size+'px';
    img.style.height = size+'px';
    img.style.objectFit = 'cover';
    img.style.left = Math.random()*80+'vw';
    img.style.top = Math.random()*80+'vh';
    img.style.animationDuration = (Math.random()*2+1.5)+'s';
    document.getElementById('screen3').appendChild(img);
    setTimeout(()=>img.remove(), 3500);
  }, 400);

  // Pháo hoa
  setInterval(() => {
    for(let i=0;i<8;i++){
      const fw = document.createElement('div');
      fw.className = 'firework';
      fw.style.left = Math.random()*100+'vw';
      fw.style.top = Math.random()*100+'vh';
      const hue = Math.random()*360;
      fw.style.background = `hsl(${hue},100%,60%)`;
      fw.style.transform = `rotate(${Math.random()*360}deg)`;
      fw.style.animationDuration = (Math.random()*1+0.8)+'s';
      document.getElementById('screen3').appendChild(fw);
      setTimeout(()=>fw.remove(), 2000);
    }
  }, 200);
}
</script>
