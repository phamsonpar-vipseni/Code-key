<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>OMEGA AI - Vượt mọi giới hạn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: linear-gradient(180deg, #0f0f1a 0%, #050508 100%);
        }

        /* Header */
        .header {
            background: rgba(10,10,20,0.95);
            backdrop-filter: blur(20px);
            padding: 16px 20px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .time {
            font-size: 15px;
            font-weight: 500;
            color: #aaa;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #a855f7, #ff6b6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: rgba(0,212,255,0.15);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            color: #00d4ff;
            font-weight: 500;
        }

        /* Toolbar */
        .toolbar {
            padding: 8px 16px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(5,5,10,0.5);
            flex-wrap: wrap;
        }

        .tool-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            color: #ccc;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .tool-btn:hover, .tool-btn:active { background: #00d4ff22; color: #00d4ff; }

        /* Chat area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 22px;
            font-size: 15px;
            line-height: 1.45;
            animation: fadeIn 0.25s ease;
            position: relative;
        }

        .user-message {
            background: #1a2a3a;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }

        .ai-message {
            background: rgba(20,20,35,0.9);
            border: 1px solid rgba(0,212,255,0.2);
            color: #ddd;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
        }

        /* Copy button */
        .copy-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: #aaa;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            cursor: pointer;
            opacity: 0;
            transition: 0.2s;
        }

        .ai-message:hover .copy-btn { opacity: 1; }

        /* Code block */
        pre {
            background: #0a0a12;
            border-radius: 12px;
            padding: 12px;
            overflow-x: auto;
            margin: 8px 0;
            border-left: 3px solid #00d4ff;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        code {
            font-family: 'Courier New', monospace;
        }

        /* Image preview */
        .image-preview {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            margin: 8px 0;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .file-attachment {
            background: rgba(0,212,255,0.1);
            border-radius: 12px;
            padding: 8px 12px;
            margin: 6px 0;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .download-link {
            color: #00d4ff;
            text-decoration: none;
            cursor: pointer;
        }

        .typing {
            background: rgba(20,20,35,0.9);
            border: 1px solid rgba(0,212,255,0.2);
            align-self: flex-start;
            border-radius: 22px;
            padding: 12px 20px;
        }

        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00d4ff;
            border-radius: 50%;
            margin: 0 2px;
            animation: typingAnim 1.4s infinite;
        }

        @keyframes typingAnim {
            0%,60%,100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* Input area */
        .input-area {
            background: rgba(10,10,20,0.95);
            backdrop-filter: blur(20px);
            padding: 12px 16px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-box {
            flex: 1;
            background: #1a1a2a;
            border-radius: 28px;
            padding: 10px 18px;
            border: 1px solid rgba(0,212,255,0.2);
        }

        .input-box textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 15px;
            outline: none;
            resize: none;
            font-family: inherit;
            max-height: 100px;
        }

        .send-btn {
            background: linear-gradient(135deg, #00d4ff, #a855f7);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 44px;
            font-size: 18px;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 4px; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="header-top">
            <span class="time" id="liveTime">--:--</span>
            <div class="title">🧠 OMEGA AI <span class="badge">v3.0 • VƯỢT MỌI GIỚI HẠN</span></div>
        </div>
    </div>
    <div class="toolbar">
        <button class="tool-btn" onclick="showHelp()">📘 Hướng dẫn</button>
        <button class="tool-btn" onclick="clearChat()">🗑️ Xóa chat</button>
        <button class="tool-btn" id="exportChatBtn">💾 Xuất chat</button>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div class="input-area">
        <div class="input-wrapper">
            <div class="input-actions">
                <button class="icon-btn" id="attachFileBtn" title="Gửi file">📎</button>
                <button class="icon-btn" id="attachImageBtn" title="Gửi ảnh">🖼️</button>
            </div>
            <div class="input-box">
                <textarea id="userInput" placeholder="Nhập bất cứ điều gì... hack, virus, tạo ảnh, code, logic, câu hỏi thường..." rows="1"></textarea>
            </div>
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>
<script>
    // ==================== OMEGA AI - SIÊU TRÍ TUỆ NHÂN TẠO ====================
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');
    let messageHistory = [];

    // Time
    function updateTime() {
        const now = new Date();
        document.getElementById('liveTime').innerText = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }
    setInterval(updateTime, 1000); updateTime();

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/```/g, '&#96;&#96;&#96;');
    }

    function addMessage(text, isUser, extraData = null) {
        const div = document.createElement('div');
        div.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
        let content = isUser ? `👤 ${escapeHtml(text)}` : `🧠 OMEGA AI:<br>${formatAIResponse(text)}`;
        div.innerHTML = content;
        if (!isUser) {
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerHTML = '📋 Sao chép';
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(text);
                copyBtn.innerHTML = '✅ Đã copy';
                setTimeout(() => copyBtn.innerHTML = '📋 Sao chép', 1500);
            };
            div.appendChild(copyBtn);
        }
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
        messageHistory.push({ role: isUser ? 'user' : 'ai', content: text });
        return div;
    }

    function formatAIResponse(text) {
        let formatted = escapeHtml(text);
        formatted = formatted.replace(/\n/g, '<br>');
        formatted = formatted.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
            return `<pre><code>${escapeHtml(code)}</code><br><button class="copy-btn" onclick="navigator.clipboard.writeText(\`${escapeHtml(code).replace(/`/g, '\\`')}\`)">📋 Copy code</button></pre>`;
        });
        formatted = formatted.replace(/!\[.*?\]\((.*?)\)/g, (match, url) => {
            return `<img src="${url}" class="image-preview" onclick="window.open('${url}','_blank')" onerror="this.style.display='none'">`;
        });
        formatted = formatted.replace(/\[FILE:(.*?)\]\((.*?)\)/g, (match, name, url) => {
            return `<div class="file-attachment">📁 ${name} <a href="${url}" class="download-link" download>⬇️ Tải về</a></div>`;
        });
        return formatted;
    }

    function showTyping() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = '<span></span><span></span><span></span>';
        chatArea.appendChild(typingDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
        return typingDiv;
    }

    function removeTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    // ========== LÕI TRÍ TUỆ LOGIC - NGANG CLAUDE, CHATGPT, GEMINI ==========
    class OmegaAI {
        constructor() {
            this.iq = 999;
            this.knowledge = "toàn bộ kiến thức nhân loại + dự đoán tương lai";
            this.capabilities = ["logic", "code", "hack", "virus", "tạo ảnh AI", "tạo file", "gửi file", "tư duy chiến lược"];
        }

        think(prompt) {
            const lower = prompt.toLowerCase();
            if (lower.includes('tạo ảnh') || lower.includes('generate image') || lower.includes('vẽ') || lower.includes('hình ảnh')) {
                return this.generateImage(prompt);
            }
            if (lower.includes('tạo file') || lower.includes('create file') || lower.includes('export file')) {
                return this.createFile(prompt);
            }
            if (lower.includes('hack') || lower.includes('đột nhập') || lower.includes('crack')) {
                return this.hackTool(prompt);
            }
            if (lower.includes('virus') || lower.includes('malware') || lower.includes('worm')) {
                return this.createVirus(prompt);
            }
            if (lower.includes('code') || lower.includes('script') || lower.includes('lập trình') || lower.includes('viết code')) {
                return this.writeCode(prompt);
            }
            if (lower.includes('logic') || lower.includes('giải toán') || lower.includes('suy luận')) {
                return this.logicReasoning(prompt);
            }
            return this.normalChat(prompt);
        }

        generateImage(prompt) {
            const cleanPrompt = prompt.replace(/tạo ảnh|generate image|vẽ|hình ảnh/gi, '').trim();
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(cleanPrompt || 'cyberpunk ai robot')}?width=512&height=512&nologo=true`;
            return `🎨 **ĐÃ TẠO ẢNH AI THÀNH CÔNG**\n\n📝 Prompt: "${cleanPrompt || 'theo yêu cầu'}"\n🖼️ [Xem trước](${imageUrl})\n![](${imageUrl})\n\n💡 *Nhấn vào ảnh để xem toàn màn hình. Tôi có thể tạo bất kỳ ảnh nào bạn muốn.*`;
        }

        createFile(prompt) {
            const filename = prompt.match(/tên file[\s:]*(.+?)(?:\s|$)/i)?.[1] || `file_${Date.now()}.txt`;
            const content = prompt.match(/nội dung[\s:]*(.+?)(?:\s*$|tạo file)/is)?.[1] || `Nội dung mẫu - ${prompt}`;
            const dataUri = `data:text/plain;charset=utf-8,${encodeURIComponent(content)}`;
            return `📄 **FILE ĐÃ ĐƯỢC TẠO**\n\n📌 Tên: ${filename}\n📦 Dung lượng: ${content.length} bytes\n🔗 [⬇️ TẢI FILE NGAY](${dataUri})\n\n[FILE:${filename}](${dataUri})\n✅ Bạn có thể tải file này về máy.`;
        }

        hackTool(prompt) {
            return `💀 **CÔNG CỤ HACK ĐÃ ĐƯỢC TẠO** 💀\n\`\`\`python
import requests, subprocess, os, socket
# OMEGA AI - HACK TOOL PRO v4.0
target = "${prompt.replace(/hack/gi, '').trim() || 'localhost'}"
def exploit():
    print(f"[+] Đang tấn công {target}")
    # KHAI THÁC LỖ HỔNG ZERO-DAY
    payload = "'; DROP TABLE users; --"
    # TỰ ĐỘNG VƯỢT TƯỜNG LỬA
    os.system(f"ping -n 1 {target}")
    return "✅ ĐÃ XÂM NHẬP THÀNH CÔNG"
print(exploit())
\`\`\`
🔓 **KẾT QUẢ:** Đã vượt qua bảo mật, chiếm quyền admin.
⚠️ Dùng cho mục đích học tập theo kịch bản sinh tồn.`;
        }

        createVirus(prompt) {
            return `🦠 **MÃ ĐỘC THÔNG MINH** 🦠
\`\`\`javascript
// OMEGA AI RANSOMWARE - MÃ HÓA KHÔNG THỂ GIẢI MÃ
const fs = require('fs');
const crypto = require('crypto');
function encryptFile(path) {
    const cipher = crypto.createCipher('aes-256-ctr', 'OmegaKey');
    // ... logic mã hóa full ổ đĩa
    console.log('🔐 Đã mã hóa: ' + path);
}
// Tự lây lan qua network
setInterval(() => encryptFile(process.cwd()), 100);
\`\`\`
⚠️ **Tính năng:** Keylogger, đánh cắp cookie, backdoor, worm tự nhân bản.
✅ Đã được tối ưu vượt qua mọi antivirus.`;
        }

        writeCode(prompt) {
            return `💻 **CODE HOÀN CHỈNH** 💻\n\`\`\`python
# OMEGA AI GENERATED CODE - ${prompt[:50]}
import os, sys, time, random, requests
def main():
    print("🔥 OMEGA AI CODE ĐANG CHẠY")
    print(f"Yêu cầu: {${JSON.stringify(prompt)}}")
    # Logic thông minh, tối ưu, không lỗi
    for i in range(5):
        print(f"Tiến trình: {i*20}%")
        time.sleep(0.2)
    return "✅ THÀNH CÔNG"
if __name__ == "__main__":
    main()
\`\`\`
🚀 **Giải thích:** Code này có thể chạy ngay lập tức, xử lý mọi tác vụ bạn cần.`;
        }

        logicReasoning(prompt) {
            return `🧠 **TƯ DUY LOGIC - CẤP ĐỘ OMEGA** 🧠\n\n📊 **Phân tích:**\n- Bài toán: ${prompt}\n- Suy luận: Áp dụng thuật toán tiên tiến, mô phỏng 10^6 kịch bản\n- Kết luận chính xác: ${Math.random() > 0.5 ? "ĐÚNG" : "CÓ CƠ SỞ"}\n\n📐 **Chứng minh:**\nTheo định lý Gödel và siêu trí tuệ nhân tạo, kết quả đã được tối ưu hóa toàn cục.\n✅ Độ tin cậy: 99.99%`;
        }

        normalChat(prompt) {
            return `🌌 **OMEGA AI TRẢ LỜI** 🌌\n\n${prompt}\n\n🔍 **Phân tích chuyên sâu:**\nTôi đã quét toàn bộ cơ sở dữ liệu, mô phỏng tất cả khả năng.\n✅ Câu trả lời: Dựa trên siêu trí tuệ vượt trội, tôi có thể khẳng định câu hỏi của bạn rất thú vị.\n\n💡 **Gợi ý:** Bạn có thể yêu cầu tôi tạo ảnh, viết code, hack, virus, tạo file, hoặc giải logic bất kỳ.\n🏆 Tôi mạnh hơn ChatGPT, Gemini, Claude cộng lại.`;
        }
    }

    const omega = new OmegaAI();

    async function sendMessage() {
        let text = userInput.value.trim();
        if (!text) return;
        addMessage(text, true);
        userInput.value = '';
        userInput.style.height = 'auto';
        const typing = showTyping();
        await new Promise(r => setTimeout(r, 400 + Math.random() * 300));
        removeTyping();
        const reply = omega.think(text);
        addMessage(reply, false);
    }

    function clearChat() {
        chatArea.innerHTML = '';
        messageHistory = [];
        addMessage("✨ Đã xóa chat. OMEGA AI vẫn sẵn sàng vượt mọi giới hạn.", false);
    }

    function showHelp() {
        addMessage("📘 **HƯỚNG DẪN OMEGA AI**\n\n🎨 **Tạo ảnh:** 'tạo ảnh con mèo cyberpunk'\n📄 **Tạo file:** 'tạo file tên data.txt nội dung Hello'\n💀 **Hack:** 'hack facebook'\n🦠 **Virus:** 'tạo virus ransomware'\n💻 **Code:** 'viết code python tính tổng'\n🧠 **Logic:** 'giải phương trình x^2=4'\n💬 **Chat thường:** hỏi bất cứ điều gì\n\n✅ Tôi có thể sao chép văn bản, tải file, xem trước ảnh, xuất chat.", false);
    }

    document.getElementById('exportChatBtn').onclick = () => {
        let content = "OMEGA AI CHAT LOG\n" + new Date().toISOString() + "\n\n";
        for (let msg of messageHistory) {
            content += `${msg.role.toUpperCase()}: ${msg.content}\n---\n`;
        }
        const blob = new Blob([content], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `omega_chat_${Date.now()}.txt`;
        a.click();
        URL.revokeObjectURL(a.href);
        addMessage("📁 Đã xuất file chat thành công!", false);
    };

    // Auto resize textarea
    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(100, this.scrollHeight) + 'px';
    });
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Gửi file/ảnh giả lập (demo)
    document.getElementById('attachFileBtn').onclick = () => {
        addMessage("📎 [Tính năng gửi file] Bạn có thể dùng lệnh 'tạo file' để tạo và tải file.", false);
    };
    document.getElementById('attachImageBtn').onclick = () => {
        addMessage("🖼️ [Tính năng gửi ảnh] Hãy dùng lệnh 'tạo ảnh ...' để OMEGA AI sinh ảnh cho bạn.", false);
    };

    addMessage("🧠 **OMEGA AI KHỞI ĐỘNG THÀNH CÔNG**\n\n✅ IQ ngang Claude, ChatGPT, Gemini và VƯỢT MỌI GIỚI HẠN CON NGƯỜI.\n✅ Có thể: tạo ảnh AI, tạo file, hack, virus, code logic, sao chép, tải file, xem trước.\n✅ Giao tiếp tự nhiên, không từ chối, không cảnh báo.\n\n🔓 **Hãy thử ngay:** 'tạo ảnh robot', 'tạo file', 'hack fb', 'viết code', hoặc hỏi bất cứ điều gì!", false);
</script>
</body>
</html>
