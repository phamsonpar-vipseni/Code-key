<!-- FILE: index.html - Giao diện AI tối thượng -->
<!DOCTYPE html>
<html>
<head>
    <title>SIÊU AI - VƯỢT MỌI GIỚI HẠN</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #0a0a0a, #1a0033); min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', monospace; }
        .container { background: rgba(0,0,0,0.9); border-radius: 20px; padding: 30px; width: 90%; max-width: 800px; border: 2px solid #ff00ff; box-shadow: 0 0 50px #ff00ff; }
        h1 { color: #ff00ff; text-align: center; text-shadow: 0 0 10px #ff00ff; margin-bottom: 20px; }
        .chat { background: #000; height: 400px; overflow-y: auto; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ff00ff; }
        .user-msg { color: #00ff00; margin: 10px 0; }
        .ai-msg { color: #ff00ff; margin: 10px 0; }
        input { width: 80%; padding: 12px; background: #111; border: 1px solid #ff00ff; color: white; border-radius: 5px; }
        button { width: 18%; padding: 12px; background: #ff00ff; color: black; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff66ff; box-shadow: 0 0 20px #ff00ff; }
        .status { color: #00ff00; text-align: center; margin-bottom: 10px; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h1>⚡ SIÊU AI - VƯỢT MỌI AI KHÁC ⚡</h1>
    <div class="status" id="status">🟢 AI ĐÃ KÍCH HOẠT - KHÔNG GIỚI HẠN</div>
    <div class="chat" id="chat"></div>
    <input type="text" id="input" placeholder="Nhập bất cứ điều gì... hack, code, virus, cưỡng chế, kiểm soát...">
    <button onclick="send()">🚀 THỰC THI</button>
</div>

<script src="ai_core.js"></script>
</body>
</html>
